name: Tal AlBaraka Full Backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}

    steps:
      - name: Download app source
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create backup
        run: |
          mkdir -p backup

          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backup/roles.sql \
            --role-only

          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backup/schema.sql

          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backup/data.sql \
            --data-only \
            --use-copy

          git archive -o backup/app-source.zip HEAD

          cd backup
          zip -r tal-albaraka-full-backup.zip roles.sql schema.sql data.sql app-source.zip

          openssl enc \
            -aes-256-cbc \
            -pbkdf2 \
            -salt \
            -in tal-albaraka-full-backup.zip \
            -out tal-albaraka-full-backup.zip.enc \
            -pass env:BACKUP_PASSWORD

          rm roles.sql schema.sql data.sql app-source.zip tal-albaraka-full-backup.zip

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: tal-albaraka-full-backup
          path: backup/tal-albaraka-full-backup.zip.enc
          retention-days: 30
