name: Deploy Vite app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
env:
  VITE_SUPABASE_URL: https://ejhsamnahzhftlvfcea.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_vyN7ew8E_H1GALA0P_7lzQ_y9w2ReOi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - uses: actions/deploy-pages@v4


